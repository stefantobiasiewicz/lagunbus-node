[project]
name = "lagunbus-node"
version = "0.5.0"
description = "LagunBus node library — the Python twin of the C library in ../c"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lagunbus_node*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# A generated file — its shape is settled by tools/generate_registry.py, not by ruff.
extend-exclude = ["lagunbus_node/registry.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["lagunbus_node", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
